name: gmp_gestor
description: "GMP Gestor - Sistema de gestão de oficina de motos (peças, ordens de serviço, funcionários e finanças)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - .env

flutter_launcher_icons:
  image_path: "assets/icons/wrench.png"
  android: true
  ios: true
  # A Apple rejeita ícone com canal alpha — usamos uma versão com fundo
  # sólido só para o iOS; as demais plataformas ficam com fundo transparente.
  image_path_ios: "assets/icons/wrench_ios.png"
  web:
    generate: true
    image_path: "assets/icons/wrench.png"
    background_color: "#f5f5ed"
    theme_color: "#f5f5ed"
  windows:
    generate: true
    image_path: "assets/icons/wrench.png"
  macos:
    generate: true
    image_path: "assets/icons/wrench.png"
