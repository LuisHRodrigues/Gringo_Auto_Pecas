name: Release Build

# Builds só rodam quando uma tag de release é enviada (ex: v1.2.0).
# Pushes/PRs comuns não disparam este workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # necessário para anexar os artefatos ao GitHub Release

env:
  FLUTTER_CHANNEL: stable

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Empacotar DLLs do VC++ Redistributable
        # flutter_windows.dll (do engine do Flutter) depende do runtime do
        # Visual C++ (msvcp140.dll, vcruntime140.dll, vcruntime140_1.dll).
        # Sem isso, quem baixar o build precisa instalar o VC++
        # Redistributable manualmente para o app abrir. O runner do GitHub
        # Actions já tem essas DLLs (vêm com o Visual Studio Build Tools),
        # então copiamos para o lado do .exe e o app fica autocontido.
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1
          if (-not $dll) { throw "msvcp140.dll não encontrada no runner." }
          $redistDir = $dll.DirectoryName
          Write-Host "Redistributable encontrado em: $redistDir"
          Copy-Item "$redistDir\msvcp140*.dll" -Destination build\windows\x64\runner\Release\
          Copy-Item "$redistDir\vcruntime140*.dll" -Destination build\windows\x64\runner\Release\

      - name: Compactar build Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath motogest-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: motogest-windows.zip
          if-no-files-found: error

      - name: Gerar instalador .exe com Inno Setup
        # O Inno Setup 6 já vem instalado no runner windows-latest do GitHub
        # Actions (image "windows-2022"/"windows-2025"). Não é necessário
        # instalar nada, só chamar o compilador ISCC.
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "windows\installer\motogest.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\motogest-setup.exe
          if-no-files-found: error

  web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter build web --release

      - name: Compactar build Web
        run: |
          cd build/web
          zip -r -X ${{ github.workspace }}/motogest-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: motogest-web.zip
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: [windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar/atualizar release e anexar artefatos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/**
            artifacts/windows-installer/**
            artifacts/web-release/**
          generate_release_notes: true
