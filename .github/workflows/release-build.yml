name: Release Build

# Builds só rodam quando uma tag de release é enviada (ex: v1.2.0).
# Pushes/PRs comuns não disparam este workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # necessário para anexar os artefatos ao GitHub Release

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Build Android (apk + aab)
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON não configurado (ou vazio) no repositório. Gere com: base64 -w0 android/app/google-services.json — e cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          if ! python3 -c "import json,sys; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "::error::android/app/google-services.json gerado é inválido — confira se o secret contém o conteúdo em base64 do arquivo (base64 -w0 android/app/google-services.json), e não o JSON puro."
            exit 1
          fi

      - run: flutter pub get

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do Linux desktop
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Compactar build Linux
        run: |
          cd build/linux/x64/release/bundle
          zip -r -X ${{ github.workspace }}/motogest-linux.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: motogest-linux.zip
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Empacotar DLLs do VC++ Redistributable
        # flutter_windows.dll (do engine do Flutter) depende do runtime do
        # Visual C++ (msvcp140.dll, vcruntime140.dll, vcruntime140_1.dll).
        # Sem isso, quem baixar o build precisa instalar o VC++
        # Redistributable manualmente para o app abrir. O runner do GitHub
        # Actions já tem essas DLLs (vêm com o Visual Studio Build Tools),
        # então copiamos para o lado do .exe e o app fica autocontido.
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1
          if (-not $dll) { throw "msvcp140.dll não encontrada no runner." }
          $redistDir = $dll.DirectoryName
          Write-Host "Redistributable encontrado em: $redistDir"
          Copy-Item "$redistDir\msvcp140*.dll" -Destination build\windows\x64\runner\Release\
          Copy-Item "$redistDir\vcruntime140*.dll" -Destination build\windows\x64\runner\Release\

      - name: Compactar build Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath motogest-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: motogest-windows.zip
          if-no-files-found: error

  web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter build web --release

      - name: Compactar build Web
        run: |
          cd build/web
          zip -r -X ${{ github.workspace }}/motogest-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: motogest-web.zip
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: [android, linux, windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar/atualizar release e anexar artefatos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-release/**
            artifacts/linux-release/**
            artifacts/windows-release/**
            artifacts/web-release/**
          generate_release_notes: true
