name: CI

# Roda em todo push/PR para main, para pegar erro de análise/teste/formatação
# antes de chegar numa tag de release (release-build.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-and-test:
    name: Analyze, format e testes
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisar código
        # --no-fatal-infos: não falha por causa de infos (ex.: APIs
        # deprecated ainda em uso) já existentes no projeto; erros e
        # warnings continuam quebrando o build normalmente.
        run: flutter analyze --no-fatal-infos

      - name: Rodar testes
        run: flutter test
